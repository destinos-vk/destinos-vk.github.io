<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинозал Destinos (Theater)</title>
    <!-- Подключаем ваш единый файл стилей -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Специфичные стили только для кинозала */
        .theater-box {
            text-align: center;
            padding: 10px 0 30px 0;
        }
        
        .episode-selector {
            margin-bottom: 25px;
        }
        
        .episode-selector select {
            padding: 12px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: 2px solid #3498db;
            background-color: #f9f9f9;
            color: #2c3e50;
            cursor: pointer;
            width: 100%;
            max-width: 500px;
            font-weight: bold;
        }

        .episode-selector select:focus {
            outline: none;
            border-color: #2980b9;
        }

        /* Делаем так, чтобы плеер красиво растягивался и не ломался на мобильных */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            background-color: #000;
        }
        
        .video-container video {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Кинозал Destinos</h1>
    <p style="text-align: center;">Выберите нужный эпизод из списка ниже, чтобы начать просмотр.</p>

    <div class="theater-box">
        <!-- ВЫПАДАЮЩИЙ СПИСОК СЕРИЙ -->
        <div class="episode-selector">
            <select id="episodeSelect" onchange="changeEpisode()">
                <option value="https://archive.org/download/destinos_pbs/DESTINOS_01.mp4">Эпизод 1: La carta</option>
                <option value="https://archive.org/download/destinos_pbs/DESTINOS_02.mp4">Эпизод 2: El secreto</option>
                <option value="https://archive.org/download/destinos_pbs/DESTINOS_03.mp4">Эпизод 3: El comienzo</option>
                <option value="https://archive.org/download/destinos_pbs/DESTINOS_04.mp4">Эпизод 4: Perdida</option>
                <option value="https://archive.org/download/destinos_pbs/DESTINOS_05.mp4">Эпизод 5: La despedida</option>
                <!-- Сюда вы можете добавлять новые строки для следующих эпизодов -->
            </select>
        </div>

        <!-- САМ ВИДЕОПЛЕЕР -->
        <div class="video-container">
            <video id="videoPlayer" controls>
                <!-- По умолчанию загружается первая серия -->
                <source src="https://archive.org/download/destinos_pbs/DESTINOS_01.mp4" type="video/mp4">
                Ваш браузер не поддерживает тег video.
            </video>
        </div>
    </div>
</div>

<!-- СКРИПТ ДЛЯ ПЕРЕКЛЮЧЕНИЯ СЕРИЙ -->
<script>
    function changeEpisode() {
        // Находим выпадающий список и плеер
        var select = document.getElementById("episodeSelect");
        var player = document.getElementById("videoPlayer");
        
        // Берем ссылку из выбранного пункта
        var videoSource = select.value;
        
        // Меняем источник видео и перезапускаем плеер
        player.src = videoSource;
        player.load(); // Даем команду браузеру загрузить новое видео
        player.play(); // Автоматически начинаем воспроизведение (по желанию)
    }
</script>

</body>
</html>
